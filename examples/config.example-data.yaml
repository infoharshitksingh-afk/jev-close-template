# Config for the synthetic example data. Run: python jevclose.py example
company_name: Example Co (synthetic data)
reporting_timezone: America/Los_Angeles
as_of_month: auto

sources:
  usage:
    type: file
    path: examples/data/raw/usage_events.jsonl.gz
    grain: daily
    columns:
      date: date
      account_id: account_id
      status: status
      calls: calls
      input_tokens: input_tokens
      output_tokens: output_tokens
      channel: channel
      model: model_served
      project_label: project_label
      avg_questions_per_call: avg_questions_per_call
      max_choice_cardinality: max_choice_cardinality
      offhours_call_share: offhours_call_share
      p95_latency_ms: p95_latency_ms
  accounts:
    type: file
    path: examples/data/raw/accounts.csv
    columns: {account_id: account_id, signup_date: signup_date, display_name: display_name, segment: segment,
              channel: channel, free_credit_usd: free_credit_usd, payment_method_added: payment_method_added}
  contracts:
    type: file
    path: examples/data/raw/contracts.csv
    columns: {account_id: account_id, customer: customer, start_date: start_date, monthly_commit_usd: monthly_commit_usd,
              unit_price_per_mtok: unit_price_per_mtok, contract_id: contract_id, discount_pct: discount_pct}
  pipeline:
    type: file
    path: examples/data/raw/pipeline.csv
    columns: {deal_id: deal_id, customer: customer, probability: probability,
              expected_monthly_commit_usd: expected_monthly_commit_usd, expected_start: expected_start,
              stage: stage, expected_discount_pct: expected_discount_pct, use_cases: use_cases}
  billing_ledger:
    type: file
    path: examples/data/raw/billing_ledger.csv
    columns: {month: month, account_id: account_id, tokens_billed: tokens_billed, unit_price_per_mtok: unit_price_per_mtok,
              usage_charge_usd: usage_charge_usd, invoice_id: invoice_id, free_credit_tokens: free_credit_tokens,
              paid_tokens: paid_tokens, true_up_usd: true_up_usd, invoice_total_usd: invoice_total_usd}
  gateway_statements:
    type: file
    path: examples/data/raw/gateway_statements.csv
    columns: {gateway: gateway, month: month, tokens_reported: tokens_reported, gross_usd: gross_usd,
              fee_pct: fee_pct, net_remitted_usd: net_remitted_usd}
  hourly:
    type: file
    path: examples/data/raw/platform_hourly_last7d.csv
    columns: {hour_start: hour_start, tokens: tokens}
  label_map:
    type: file
    path: examples/data/raw/label_map.csv
    columns: {project_label: project_label, use_case: use_case}

billing:
  billable_statuses: [200]
  prices:
    - {effective_from: 2026-09-15, price_per_mtok: 0.042}
  free_credit_usd: 5.0
  free_credit_channels: [direct]
  prorate_partial_months: true

gateways:
  vercel:       {fee_pct: 0.05, passes_customer_ids: true}
  openrouter:   {fee_pct: 0.05, passes_customer_ids: false}
  digitalocean: {fee_pct: 0.08, passes_customer_ids: true}
gateway_revenue_treatment: net

checks:
  billed_tokens_tolerance_pct: 0.0005
  gateway_tolerance_pct: 0.005
  remittance_tolerance_usd: 0.02
  price_tolerance_per_mtok: 1.0e-9
  concentration_threshold: 0.5
  unclassified_threshold: 0.2

forecast:
  tail_factor: {low: 0.93, base: 0.97, high: 1.0}
  gateway_growth_decay: 0.5
  ent_usage_ratio: {low: 0.8, base: 1.0, high: 1.2}
  ent_growth: {low: 0.0, base: 0.03, high: 0.06}
  ent_ramp_days: 60

capacity:
  gpu_tokens_per_sec: 20604
  peak_utilization: 0.85
  reserved_rate: 2.50
  on_demand_rate: 3.00
  peak_ratio_override: 1.75
  base_ratio_override: 0.55

outputs:
  dir: examples/outputs
