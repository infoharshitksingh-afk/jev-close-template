# Test: only the two required sources.
company_name: Example Co (synthetic data)
reporting_timezone: America/Los_Angeles
as_of_month: auto
sources:
  usage:
    type: file
    path: examples/data/raw/usage_events.jsonl.gz
    grain: daily
    columns:
      date: date
      account_id: account_id
      status: status
      calls: calls
      input_tokens: input_tokens
      output_tokens: output_tokens
      channel: channel
      model: model_served
      project_label: project_label
      avg_questions_per_call: avg_questions_per_call
      max_choice_cardinality: max_choice_cardinality
      offhours_call_share: offhours_call_share
      p95_latency_ms: p95_latency_ms
  accounts:
    type: file
    path: examples/data/raw/accounts.csv
    columns:
      account_id: account_id
      signup_date: signup_date
      display_name: display_name
      segment: segment
      channel: channel
      free_credit_usd: free_credit_usd
      payment_method_added: payment_method_added
  contracts:
    skip: true
  pipeline:
    skip: true
  billing_ledger:
    skip: true
  gateway_statements:
    skip: true
  hourly:
    skip: true
  label_map:
    skip: true
billing:
  billable_statuses:
  - 200
  prices:
  - effective_from: 2026-09-15
    price_per_mtok: 0.042
  free_credit_usd: 5.0
  free_credit_channels:
  - direct
  prorate_partial_months: true
gateways:
  vercel:
    fee_pct: 0.05
    passes_customer_ids: true
  openrouter:
    fee_pct: 0.05
    passes_customer_ids: false
  digitalocean:
    fee_pct: 0.08
    passes_customer_ids: true
gateway_revenue_treatment: net
checks:
  billed_tokens_tolerance_pct: 0.0005
  gateway_tolerance_pct: 0.005
  remittance_tolerance_usd: 0.02
  price_tolerance_per_mtok: 1.0e-09
  concentration_threshold: 0.5
  unclassified_threshold: 0.2
forecast:
  tail_factor:
    low: 0.93
    base: 0.97
    high: 1.0
  gateway_growth_decay: 0.5
  ent_usage_ratio:
    low: 0.8
    base: 1.0
    high: 1.2
  ent_growth:
    low: 0.0
    base: 0.03
    high: 0.06
  ent_ramp_days: 60
capacity:
  gpu_tokens_per_sec: 20604
  peak_utilization: 0.85
  reserved_rate: 2.5
  on_demand_rate: 3.0
  peak_ratio_override: 1.75
  base_ratio_override: 0.55
outputs:
  dir: tests/outputs_min
